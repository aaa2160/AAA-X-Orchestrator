name: Build AAA X-Orchestrator APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew test --stacktrace

    - name: Build Debug & Release APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AAA-X-Orchestrator-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

    - name: Create or Update GitHub Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.1.0
        name: "AAA X-Orchestrator v1.1.0"
        body: |
          ### AAA X-Orchestrator Production Release v1.1.0
          - **On-Device Vision Intelligence**: Bundled Google ML Kit offline text recognition engine with Polish number and captcha extraction.
          - **Resilient Room SQLite & DAO**: Generated Room `AppDatabase_Impl` and `AccountDao_Impl` via Kapt with failover in-memory buffer.
          - **Adaptive Icon Suite**: Beautiful geometric monogram adaptive squircle icon for Samsung One UI.
          - **Titanium AdBlock Shield**: Offline ad & tracker interceptor with render process crash protection for low-RAM devices.
          - **Real-Time Diagnostics**: Live authenticated Webshare proxy latency test and live battery/thermal guard telemetry.
          - **Polish 2nr SMS Extraction**: Multi-pattern OTP parser (hyphenated, spaced, and Twitter G- codes).
          - **Telegram Batch Chunking**: Chunked message dispatcher preventing HTTP 400 length limit errors.
          - **One-Click Account Export**: Native Android Sharesheet bulk export from Accounts Vault.
        files: |
          app/build/outputs/apk/debug/app-debug.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
