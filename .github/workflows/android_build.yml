name: Build AAA X-Orchestrator APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew test --stacktrace

    - name: Build Debug & Release APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AAA-X-Orchestrator-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

    - name: Create or Update GitHub Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.7.0
        name: "AAA X-Orchestrator v1.7.0"
        body: |
          ### AAA X-Orchestrator Production Release v1.7.0 (Floating 2nr Overlay, Split-Screen & German Bypass Route)
          - **Macroify-Style Floating 2nr Companion Overlay (`FloatingAssistantService.kt`)**:
            - Draggable floating HUD staying on top when interacting with the standalone 2nr app.
            - Real-time display of captured Polish number (`+48...`) with 1-tap "Copy & Return to AAA-X".
            - Live emerald OTP banner that flashes when 2nr receives the verification code, with 1-tap "Fill OTP & Return".
            - Eliminates tedious app-switching and manual typing.
          - **Samsung Multi-Window Split-Screen Integration (`AppLauncher.kt`)**:
            - 1-tap launcher opening 2nr side-by-side with AAA-X Browser (`FLAG_ACTIVITY_LAUNCH_ADJACENT`).
          - **Twitter New Method Integration (@EHR_QUICKSMS_BACKUP/374)**:
            - **Face Verification Bypass**: Added Germany (🇩🇪) route in `ProxyEngine.kt` to bypass Twitter/X Face Verification challenges.
            - **6 OTPs Per Number Quota**: Increased `MAX_ACCOUNTS_PER_NUMBER` in `TelephonySlot.kt` to 6 OTPs per Polish number.
            - **1-Tap Route Switcher**: Quick toggle between 🇩🇪 Germany (Bypass Mode) and 🇵🇱 Poland (Carrier Match) in Browser HUD and Settings.
        files: |
          app/build/outputs/apk/debug/app-debug.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
