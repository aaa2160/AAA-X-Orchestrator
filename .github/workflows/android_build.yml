name: Build AAA X-Orchestrator APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew test --stacktrace

    - name: Build Debug & Release APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AAA-X-Orchestrator-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

    - name: Create or Update GitHub Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.6.0
        name: "AAA X-Orchestrator v1.6.0"
        body: |
          ### AAA X-Orchestrator Production Release v1.6.0 (Accessibility 2nr Auto-Detection & Titanium AdBlock)
          - **Automatic 2nr Phone Extraction**:
            - Added live Accessibility node tree inspection in `OrchestratorAccessibilityService.kt`.
            - Automatically detects Polish mobile phone numbers (`+48...`) from active 2nr window hierarchies (`pl.rs.sip.softphone`, `pl.m2nr`, `two_nr`) without manual typing or switching.
          - **Titanium AdBlock & Anti-Tracking Engine**:
            - Integrated `AdBlockEngine.kt` with offline asset-backed rule databases (`easylist_rules.txt` and `trackers_hosts.txt`).
            - Network-level cancellation of advertising scripts, beacons, and trackers in `WebViewClient.shouldInterceptRequest`.
            - DOM-level cosmetic ad hiding injecting CSS (`display: none !important;`) on page completion to eliminate empty ad banners.
            - Interactive `🛡️` shield badge on browser toolbar displaying real-time blocked ads and trackers count.
          - **Macroify-Style Permission Setup Center**:
            - Added 1-tap direct Android settings navigation for Accessibility, 2nr Notification Listener, Overlay, Battery Optimization, and Notifications.
          - **Full Professional Browser Suite**:
            - Multi-tab manager, Android DownloadManager listener, in-page search (`findAllAsync`), bookmarks, history, and incognito mode.
          - **Transparent On-Device AI**:
            - Offline Google ML Kit OCR running 100% locally on Samsung Galaxy A30 with zero cloud data transmission.
        files: |
          app/build/outputs/apk/debug/app-debug.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
