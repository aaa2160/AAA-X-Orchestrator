name: Build AAA X-Orchestrator APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew test --stacktrace

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AAA-X-Orchestrator-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

    - name: Create or Update GitHub Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      continue-on-error: true
      with:
        tag_name: v2.0.${{ github.run_number }}
        name: "AAA X-Orchestrator v2.0.${{ github.run_number }}"
        body: |
          ### AAA X-Orchestrator Release v2.0.${{ github.run_number }}
          - Multi-WebView Tab Preservation: Switching tabs no longer resets pages, inputs, or sessions.
          - Chrome-Style Sleek Omnibox: Streamlined top bar with SSL lock, tab counter badge, and overflow menu.
          - Geolocation Privacy Shield: Strict rejection of GPS location requests with Frankfurt Germany cloud gateway spoofing.
          - Enhanced DOM AutoPilot: Handles landing Continue with phone CTA, switches from email to phone automatically, confirms SMS dialogs, fills OTP and passwords.
          - Titanium AdBlocker: Blocks intrusive advertising and analytics.
        files: |
          app/build/outputs/apk/debug/app-debug.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
