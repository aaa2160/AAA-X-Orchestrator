name: Build AAA X-Orchestrator APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew test --stacktrace

    - name: Build Debug & Release APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AAA-X-Orchestrator-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

    - name: Create or Update GitHub Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.3.0
        name: "AAA X-Orchestrator v1.3.0"
        body: |
          ### AAA X-Orchestrator Production Release v1.3.0 (Full Normal Browser & Zero-Simulation Engine)
          - **Full Normal Modern Browser**: Added interactive Omnibox (address/search bar) with URL typing, Google search fallback, navigation toolbar (Back, Forward, Reload, Home), Desktop Mode toggle, WebChromeClient, and live progress bar.
          - **Quick Bookmarks**: One-tap instant access to X.com, X Signup Flow, Google, DuckDuckGo, and 2nr Web.
          - **Minimizable / Collapsible Workflow HUD**: Workflow tools can be collapsed with 1 tap, giving 100% screen space for normal web browsing.
          - **Custom Phone Number Editing**: Users can now directly enter and edit their real Polish 2nr phone number in the HUD.
          - **Eradicated All Mock / Simulated Remnants**: Removed dummy 2FA secrets, random fallback usernames, and simulation toasts. Accounts and sessions only exist from real user activity.
        files: |
          app/build/outputs/apk/debug/app-debug.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
