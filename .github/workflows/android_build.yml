name: Build AAA X-Orchestrator APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew test --stacktrace

    - name: Build Debug & Release APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AAA-X-Orchestrator-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

    - name: Create or Update GitHub Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.0
        name: "AAA X-Orchestrator v1.0.0"
        body: |
          ### AAA X-Orchestrator Release v1.0.0
          - Native Jetpack Compose Material 3 UI (Strict Light Mode)
          - Master 8-Phase Coroutines Automation Engine
          - 2nr 3-Slot Number Pool with Infinite Quota Recycling
          - Email OTP Extraction (< 180ms)
          - In-Memory RFC 6238 TOTP Engine
          - Automated Phone Unlinking
          - Hardware Emergency Kill Switch (Volume Down + Shake)
          - Telegram Backup Channel Batch Sync (-1003932377927)
          - Google Sheets & Encrypted Local Room DB (WAL)
        files: |
          app/build/outputs/apk/debug/app-debug.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
