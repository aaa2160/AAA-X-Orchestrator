name: Build AAA X-Orchestrator APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew test --stacktrace

    - name: Build Debug & Release APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AAA-X-Orchestrator-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

    - name: Create or Update GitHub Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.5.0
        name: "AAA X-Orchestrator v1.5.0"
        body: |
          ### AAA X-Orchestrator Production Release v1.5.0 (Macroify Permission Setup & Professional Browser Suite)
          - **Macroify-Style Permission Setup Center**: Added interactive system permissions dashboard with 1-tap direct Android settings redirects for Accessibility Service, 2nr Notification Listener, Display Over Other Apps (Overlay), Battery Optimization Exemption, and Notifications.
          - **Full Professional Browser Suite**:
            - **Multi-Tab Architecture**: Open, switch, and close multiple tabs with dynamic tab counter badge.
            - **Download Manager**: Native Android DownloadManager integration for file, APK, and document downloads.
            - **Find in Page**: Search words and text on any loaded webpage with next/previous match jumping.
            - **Bookmarks & Browsing History**: Save favorite sites with star button, browse history logs with timestamps.
            - **Native Webpage Sharing**: 1-tap Android sharesheet to dispatch links.
            - **Incognito / Private Mode**: Zero-trace browsing without saving history or cache.
          - **Transparent AI Architecture**: Clarified Google ML Kit offline on-device vision neural network running 100% locally on Galaxy A30 for phone/captcha OCR with zero cloud reliance.
        files: |
          app/build/outputs/apk/debug/app-debug.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
