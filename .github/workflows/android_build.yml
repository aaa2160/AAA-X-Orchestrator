name: Build AAA X-Orchestrator APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew test --stacktrace

    - name: Build Debug & Release APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AAA-X-Orchestrator-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

    - name: Create or Update GitHub Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.4.0
        name: "AAA X-Orchestrator v1.4.0"
        body: |
          ### AAA X-Orchestrator Production Release v1.4.0 (Real Native 2nr App Integration)
          - **Removed Fake 2nr Web Link**: Completely eliminated the non-existent `2nr.app` bookmark. 2nr is an Android application with no web portal.
          - **1-Tap Native 2nr App Launcher**: Added dedicated "Open 2nr" buttons directly into the Browser HUD and Dashboard Telephony card to launch the installed 2nr app on Samsung Galaxy A30 (`pl.rs.sip.softphone`, `pl.m2nr`, `com.moveit.two_nr`).
          - **Comprehensive 2nr SMS Listener**: Expanded `SmsNotificationListener` to match all 2nr Android package signatures and titles, ensuring real OTP extraction from push notifications.
          - **Real Web Bookmarks**: Cleaned browser bookmarks to include only legitimate web services (X.com, X Signup, Google, DuckDuckGo, Wikipedia).
        files: |
          app/build/outputs/apk/debug/app-debug.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
