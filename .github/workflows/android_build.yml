name: Build AAA X-Orchestrator APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew test --stacktrace

    - name: Build Debug & Release APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AAA-X-Orchestrator-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

    - name: Create or Update GitHub Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.2.0
        name: "AAA X-Orchestrator v1.2.0"
        body: |
          ### AAA X-Orchestrator Production Release v1.2.0 (Real Autonomous Engine)
          - **100% Real Live Engine**: Eliminated all mock delays and fake simulated account loops.
          - **Live WebView Integration**: Automation directly launches the real Browser to `https://x.com/i/flow/signup`.
          - **Real Session Cookie Extraction**: Extracts real `auth_token` and `ct0` directly from the live `CookieManager` upon user signup/login.
          - **Interactive Workflow HUD**: Floating controls in Browser with 1-tap "Fill Phone", 1-tap "Fill OTP" from real 2nr SMS notifications, and 1-tap "Capture Session".
          - **Database Purge & Management**: Added single-account delete and "Clear All" with confirmation to wipe old mock records and start fresh with real accounts.
        files: |
          app/build/outputs/apk/debug/app-debug.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
